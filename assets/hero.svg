<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <!-- Paleta Tokyo Night (github.com/folke/tokyonight.nvim) -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1F2335" stroke-width="1"/>
    </pattern>
    <style>
      .role { font-size: 25px; fill: #A9B1D6; opacity: 0; animation: cycle 9s infinite; }
      .r2 { animation-delay: 3s; }
      .r3 { animation-delay: 6s; }
      @keyframes cycle { 0% { opacity: 0; transform: translateY(8px); } 4%, 30% { opacity: 1; transform: translateY(0); } 34%, 100% { opacity: 0; transform: translateY(-8px); } }
      .cursor { fill: #7AA2F7; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .chip { fill: none; stroke-width: 1.5; }
      .chiptext { font-size: 15px; text-anchor: middle; }
      .flow { fill: none; stroke-width: 2; stroke-dasharray: 5 7; animation: dash 1.4s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      .node { fill: #24283B; stroke-width: 1.5; }
      .nlabel { fill: #C0CAF5; font-size: 15px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="340" rx="16" fill="#16161E"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="none" stroke="#292E42"/>

  <text x="60" y="95" font-size="58" font-weight="700" fill="#7AA2F7">Hola, soy <tspan fill="#BB9AF7">Alba</tspan> <tspan font-size="48">👋</tspan></text>

  <g>
    <text class="role" x="62" y="145">Data Engineer · pipelines en AWS de punta a punta</text>
    <text class="role r2" x="62" y="145">Backend Java · Spring Boot y WebFlux desde hace +5 años</text>
    <text class="role r3" x="62" y="145">Equipos de agentes de IA que programan con TDD y CI</text>
    <rect class="cursor" x="62" y="156" width="14" height="3"/>
  </g>

  <g>
    <rect class="chip" x="60" y="180" width="230" height="34" rx="17" stroke="#FF9E64"/>
    <text class="chiptext" x="175" y="202" fill="#FF9E64">AWS Certified AI Practitioner</text>
    <rect class="chip" x="302" y="180" width="160" height="34" rx="17" stroke="#9ECE6A"/>
    <text class="chiptext" x="382" y="202" fill="#9ECE6A">España · remoto</text>
    <rect class="chip" x="474" y="180" width="250" height="34" rx="17" stroke="#7DCFFF"/>
    <text class="chiptext" x="599" y="202" fill="#7DCFFF">Kaggle: RMSLE 0,458 → 0,388</text>
  </g>

  <g>
    <path class="flow" stroke="#7DCFFF" d="M190 286 H260"/>
    <path class="flow" stroke="#BB9AF7" d="M390 286 H460"/>
    <path class="flow" stroke="#E0AF68" d="M590 286 H660"/>
  </g>
  <g>
    <circle r="4.5" fill="#7DCFFF"><animateMotion dur="3.5s" repeatCount="indefinite" path="M125 286 H725"/></circle>
    <circle r="4.5" fill="#BB9AF7"><animateMotion dur="3.5s" begin="1.75s" repeatCount="indefinite" path="M125 286 H725"/></circle>
  </g>
  <g>
    <rect class="node" x="60" y="258" width="130" height="56" rx="10" stroke="#7DCFFF"/>
    <text class="nlabel" x="125" y="291">Datos</text>
    <rect class="node" x="260" y="258" width="130" height="56" rx="10" stroke="#FF9E64"/>
    <text class="nlabel" x="325" y="291">Pipelines</text>
    <rect class="node" x="460" y="258" width="130" height="56" rx="10" stroke="#BB9AF7"/>
    <text class="nlabel" x="525" y="291">Modelos</text>
    <rect class="node" x="660" y="258" width="130" height="56" rx="10" stroke="#E0AF68"/>
    <text class="nlabel" x="725" y="291">Agentes IA</text>
  </g>

  <g transform="translate(860 70)">
    <line x1="0" y1="205" x2="290" y2="205" stroke="#292E42" stroke-width="2"/>
    <polyline fill="none" stroke="#7AA2F7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="600" stroke-dashoffset="600"
      points="0,170 40,150 80,158 120,120 160,128 200,90 240,96 280,40">
      <animate attributeName="stroke-dashoffset" values="600;0;0;600" keyTimes="0;0.45;0.85;1" dur="6s" repeatCount="indefinite"/>
    </polyline>
    <polyline fill="none" stroke="#BB9AF7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="600" stroke-dashoffset="600"
      points="0,190 40,182 80,176 120,170 160,150 200,146 240,120 280,104">
      <animate attributeName="stroke-dashoffset" values="600;0;0;600" keyTimes="0;0.55;0.85;1" dur="6s" repeatCount="indefinite"/>
    </polyline>
  </g>
  <text x="1140" y="318" font-size="12" fill="#565F89" text-anchor="end">datos que se mueven solos, medidos y con tests</text>
</svg>
