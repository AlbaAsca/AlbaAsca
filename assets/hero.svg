<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1026"/>
      <stop offset="1" stop-color="#212946"/>
    </linearGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#08F7FE"/>
      <stop offset="0.5" stop-color="#FE53BB"/>
      <stop offset="1" stop-color="#F5D300"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2A3459" stroke-width="1"/>
    </pattern>
    <style>
      .role { font-size: 26px; fill: #E0E6F0; opacity: 0; animation: cycle 9s infinite; }
      .r2 { animation-delay: 3s; }
      .r3 { animation-delay: 6s; }
      @keyframes cycle { 0% { opacity: 0; transform: translateY(8px); } 4%, 30% { opacity: 1; transform: translateY(0); } 34%, 100% { opacity: 0; transform: translateY(-8px); } }
      .cursor { fill: #08F7FE; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .chip { fill: #0B1026; stroke-width: 1.5; }
      .chiptext { font-size: 15px; text-anchor: middle; }
      .flow { fill: none; stroke-width: 2.5; stroke-dasharray: 6 8; animation: dash 1.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      .node { fill: #161D3A; stroke-width: 2; }
      .nlabel { fill: #E0E6F0; font-size: 15px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)" opacity="0.55"/>

  <text x="60" y="95" font-size="60" font-weight="800" fill="url(#name)" filter="url(#glow)">Hola, soy Alba <tspan font-size="50">👋</tspan></text>

  <!-- Roles que van rotando -->
  <g>
    <text class="role" x="62" y="145">Data Engineer · pipelines en AWS de punta a punta</text>
    <text class="role r2" x="62" y="145">Backend Java · Spring Boot y WebFlux desde hace +5 años</text>
    <text class="role r3" x="62" y="145">Equipos de agentes de IA que programan con TDD y CI</text>
    <rect class="cursor" x="62" y="156" width="14" height="3"/>
  </g>

  <!-- Chips -->
  <g>
    <rect class="chip" x="60" y="180" width="230" height="34" rx="17" stroke="#FF9900"/>
    <text class="chiptext" x="175" y="202" fill="#FF9900">AWS Certified AI Practitioner</text>
    <rect class="chip" x="302" y="180" width="160" height="34" rx="17" stroke="#00ff41"/>
    <text class="chiptext" x="382" y="202" fill="#00ff41">España · remoto</text>
    <rect class="chip" x="474" y="180" width="250" height="34" rx="17" stroke="#08F7FE"/>
    <text class="chiptext" x="599" y="202" fill="#08F7FE">Kaggle: RMSLE 0,458 → 0,388</text>
  </g>

  <!-- Lo que construyo -->
  <g>
    <path class="flow" stroke="#08F7FE" d="M190 286 H260"/>
    <path class="flow" stroke="#FE53BB" d="M390 286 H460"/>
    <path class="flow" stroke="#F5D300" d="M590 286 H660"/>
  </g>
  <g filter="url(#glow)">
    <circle r="5" fill="#08F7FE"><animateMotion dur="3.5s" repeatCount="indefinite" path="M125 286 H725"/></circle>
    <circle r="5" fill="#FE53BB"><animateMotion dur="3.5s" begin="1.75s" repeatCount="indefinite" path="M125 286 H725"/></circle>
  </g>
  <g>
    <rect class="node" x="60" y="258" width="130" height="56" rx="12" stroke="#08F7FE"/>
    <text class="nlabel" x="125" y="291">Datos</text>
    <rect class="node" x="260" y="258" width="130" height="56" rx="12" stroke="#FF9900"/>
    <text class="nlabel" x="325" y="291">Pipelines</text>
    <rect class="node" x="460" y="258" width="130" height="56" rx="12" stroke="#FE53BB"/>
    <text class="nlabel" x="525" y="291">Modelos</text>
    <rect class="node" x="660" y="258" width="130" height="56" rx="12" stroke="#F5D300"/>
    <text class="nlabel" x="725" y="291">Agentes IA</text>
  </g>

  <!-- Gráfico decorativo de la derecha -->
  <g transform="translate(860 70)" filter="url(#glow)">
    <polyline fill="none" stroke="#08F7FE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="600" stroke-dashoffset="600"
      points="0,170 40,150 80,158 120,120 160,128 200,90 240,96 280,40">
      <animate attributeName="stroke-dashoffset" values="600;0;0;600" keyTimes="0;0.45;0.85;1" dur="6s" repeatCount="indefinite"/>
    </polyline>
    <polyline fill="none" stroke="#FE53BB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="600" stroke-dashoffset="600"
      points="0,190 40,182 80,176 120,170 160,150 200,146 240,120 280,104">
      <animate attributeName="stroke-dashoffset" values="600;0;0;600" keyTimes="0;0.55;0.85;1" dur="6s" repeatCount="indefinite"/>
    </polyline>
    <line x1="0" y1="205" x2="290" y2="205" stroke="#2A3459" stroke-width="2"/>
  </g>
  <text x="1140" y="318" font-size="12" fill="#5B6B8C" text-anchor="end">datos que se mueven solos, medidos y con tests</text>
</svg>
